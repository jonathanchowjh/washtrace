# The demo: a local chain with a scripted market, and an Etherscan-shaped API
# over it, so the whole service runs with no keys and no provider.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# Then http://localhost:8080. The worker reads the collection within a minute;
# its verdicts arrive about seven minutes after the seeder finishes, since
# analyses of one collection are spaced five minutes apart (ANALYZE_GAP_MS).
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--auto-impersonate"]

  explorer:
    build: { context: ., target: build }
    image: washtrace-demo
    command: ["node", "scripts/demo/explorer.mjs"]
    environment:
      RPC: http://anvil:8545
      PORT: "8081"
    depends_on: [anvil]

  seed:
    image: washtrace-demo
    command: ["node", "scripts/demo/seed.mjs"]
    # Node's fetch cannot set Host, so the seeder shares the api's network and
    # reaches it as localhost: writes are only accepted from this machine.
    network_mode: "service:api"
    environment:
      RPC: http://anvil:8545
      API: http://localhost:8080
    depends_on: [anvil, explorer, api]
    restart: "no"

  # Both services read the same settings, as in production.
  worker:
    environment: &demo
      WASHTRACE_RPC_31337: http://anvil:8545
      WASHTRACE_ETHERSCAN_URL: http://explorer:8081/api
      WASHTRACE_ETHERSCAN_KEY: demo
      WASHTRACE_ETHERSCAN_RPS: "50"

  api:
    environment: *demo

# washtrace as two services over one Postgres:
#
#   worker  polls chains and Etherscan on timers, writes the store. No HTTP
#           but its health check.
#   api     the JSON API and the console, on :8080. Reads the store; never
#           calls a chain.
#
# `docker compose up --build`, then http://localhost:8080. Settings come from
# .env beside this file (copy .env.example); both services read the same
# file, so they describe the same deployment.
#
# Scale either on its own: `docker compose up --scale worker=2`. Each pass
# takes its job's advisory lock, so two workers still do one worker's work,
# and one takes over when the other dies.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: washtrace
      POSTGRES_PASSWORD: washtrace
      POSTGRES_DB: washtrace
    volumes:
      - db:/var/lib/postgresql/data
    # Parallel queries share memory through /dev/shm, which Docker caps at 64 MB.
    # A collection page runs its queries at once, and over a big money trail
    # (BAYC) they outgrew that and failed with "could not resize shared memory".
    shm_size: 256mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washtrace -d washtrace"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ., target: worker }
    image: washtrace-worker
    depends_on:
      db: { condition: service_healthy }
    env_file:
      - path: .env
        required: false
    environment:
      WASHTRACE_STORE_URL: postgres://washtrace:washtrace@db:5432/washtrace
    # Stored data downloaded from Hugging Face lands in a named volume, not the
    # repo or the image. /app/data/stored is where the worker looks and writes,
    # unless WASHTRACE_STORED_DIR says otherwise. Replicas share it.
    volumes:
      - stored:/app/data/stored
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    image: washtrace-api
    depends_on:
      db: { condition: service_healthy }
    env_file:
      - path: .env
        required: false
    environment:
      WASHTRACE_STORE_URL: postgres://washtrace:washtrace@db:5432/washtrace
    # Settings can be saved without a login only from this machine, so the port is
    # published to it alone: a machine on the network could otherwise send
    # `Host: localhost` to an all-interfaces port. To serve others, set
    # WASHTRACE_USERNAME and WASHTRACE_PASSWORD and publish it wider.
    ports:
      - "127.0.0.1:8080:8080"
    # The worker's stored data, read only: the console describes the manifest the worker fetched.
    volumes:
      - stored:/app/data/stored:ro
    restart: unless-stopped

volumes:
  db:
  stored:
